{% extends "posts/base.html" %}

{% block content %}
    <section class="panel form-card auth-card">
        <h1>Cambiar contraseña</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit">Guardar cambios</button>
                <a class="btn btn-alt" href="{% url 'ver_perfil' %}">Volver</a>
            </div>
        </form>
    </section>
{% endblock %}
