{% extends "posts/base.html" %}

{% block content %}
    <section class="panel form-card auth-card">
        <h1>Iniciar sesion</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit">Entrar</button>
                <a class="btn btn-alt" href="{% url 'lista_posts' %}">Volver</a>
            </div>

            <p class="form-note">¿No tiene cuenta? <a href="{% url 'registro' %}">Crear cuenta</a></p>
        </form>
    </section>
{% endblock %}
