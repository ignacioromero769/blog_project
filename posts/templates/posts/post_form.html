{% extends "posts/base.html" %}

{% block content %}
    <section class="panel form-card">
        {% if form.instance.pk %}
            <h1>Editar post</h1>
        {% else %}
            <h1>Crear post</h1>
        {% endif %}

        {% if form.instance.imagen %}
            <div class="current-image">
                <p>Imagen actual:</p>
                <img src="{{ form.instance.imagen.url }}" alt="{{ form.instance.titulo }}" />
            </div>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form }}

            {% if form.errors %}
                <div class="error_message">Hay errores con el formulario</div>
            {% endif %}

            <div class="form-actions">
                <button type="submit">Guardar cambios</button>
                <a class="btn btn-alt" href="{% url 'lista_posts' %}">Volver</a>
            </div>
        </form>
    </section>
{% endblock %}
