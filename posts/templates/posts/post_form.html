{% extends "posts/base.html" %}

{% block content %}
    {% if form.instance.pk %}
    <h2>Editar post</h2>
    {% else %}
    <h2>Crear post</h2>
    {% endif %}
    {% if form.instance.imagen %}
    <p>Imagen actual:</p>
    <img src="{{ form.instance.imagen.url }}" alt={{ form.instance.titulo }} width="200" />
    {% endif %}
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form }}
        <p><button type="submit">Guardar cambios</button><a href="{% url 'lista_posts' %}">volver</a></p>
    </form>
{% endblock %}
