{% extends "posts/base.html" %}

{% block content %}
    <section class="panel form-card danger-card">
        <h1>Eliminar post</h1>
        <p>Estas por eliminar el post "{{ post.titulo }}", estas seguro?</p>

        <div class="form-actions">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn-danger">Si, eliminar</button>
            </form>
            <a class="btn btn-alt" href="{% url 'lista_posts' %}">Volver</a>
        </div>
    </section>
{% endblock %}
